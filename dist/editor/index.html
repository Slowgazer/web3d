<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 场景编辑器</title>
  <script type="module" crossorigin src="/assets/editor-DcCCo6qX.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/three.module-BOao2756.js">
  <link rel="modulepreload" crossorigin href="/assets/lil-gui.esm-CCu4F-UZ.js">
  <link rel="modulepreload" crossorigin href="/assets/TransformControls-C_Bx3hRc.js">
  <link rel="stylesheet" crossorigin href="/assets/editor-Olj8jKEK.css">
</head>
<body>
  <div id="toolbar">
    <div class="tool-group">
      <span class="label">创建</span>
      <button data-shape="Box" class="active">立方体</button>
      <button data-shape="Sphere">球体</button>
      <button data-shape="Cone">圆锥</button>
      <button data-shape="Cylinder">圆柱</button>
      <button data-shape="Torus">圆环</button>
      <button data-shape="TorusKnot">环面结</button>
      <button data-shape="Dodecahedron">十二面体</button>
      <button data-shape="Icosahedron">二十面体</button>
      <button data-shape="Plane">平面</button>
    </div>
    <div class="divider"></div>
    <div class="tool-group">
      <span class="label">变换</span>
      <button id="mode-translate" class="active">移动</button>
      <button id="mode-rotate">旋转</button>
      <button id="mode-scale">缩放</button>
    </div>
    <div class="divider"></div>
    <div class="tool-group">
      <span class="label">操作</span>
      <button id="btn-duplicate">复制</button>
      <button id="btn-delete">删除</button>
      <button id="btn-clear">清空</button>
    </div>
  </div>
  <div id="info">🖱 点击物体选中 · 拖拽变换 · 滚轮缩放 · <kbd>Z</kbd> 切换面板 · <kbd>W</kbd><kbd>E</kbd><kbd>R</kbd> 切换模式</div>
  <div id="selection-info"></div>
</body>
</html>
