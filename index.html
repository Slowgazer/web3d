<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吉卜力风格 · 海上列车</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="scene-tools">
    <button id="btn-random-shape">🎲 随机形状</button>
    <button id="btn-daynight">🌓 黑夜</button>
    <button id="btn-snow">❄️ 下雪</button>
    <button id="btn-rain">🌧 下雨</button>
    <button id="btn-swirl">🌀 星轨</button>
    <button id="btn-train-start">🚂 发车</button>
    <button id="btn-pause">⏸ 暂停</button>
    <button id="btn-delete-selected" style="color:#ff6b6b">🗑 删除</button>
  </div>
  <div id="color-picker" style="display:none">
    <label>🎨 颜色 <input type="color" id="shape-color-input"></label>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
